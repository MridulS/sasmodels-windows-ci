name: Windows wheel without tccbox

on:
  workflow_dispatch:

jobs:
  windows-wheel:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tccbox is not a build dependency
        shell: pwsh
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('tccbox') is None"
          python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb')); r=p['build-system']['requires']; assert all(x.partition(';')[0].strip().lower() != 'tccbox' for x in r), r"

      - name: Build isolated wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade build
          python -m build --wheel -v

      - name: Test base wheel without tccbox
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem "dist\sasmodels-*.whl").FullName
          $envPath = Join-Path $env:RUNNER_TEMP "sasmodels-base"

          python -m venv $envPath
          $python = Join-Path $envPath "Scripts\python.exe"

          & $python -m pip install $wheel
          & $python -m pip check
          & $python -c "import importlib.util; assert importlib.util.find_spec('tccbox') is None"

          Set-Location $env:RUNNER_TEMP
          & $python -c "import sasmodels.kerneldll; print('Wheel works without tccbox')"
